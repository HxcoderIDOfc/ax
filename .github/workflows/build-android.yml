name: Build Nera AI APK

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Optional build label
        required: false
        default: manual

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
      VITE_NERA_API_URL: https://api.axynera.my.id/v1/chat/completions
      VITE_NERA_MODEL: Nera-V4

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Android permissions
        shell: python
        run: |
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permissions = '''
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
          '''
          text = text.replace('<application', permissions + '\n    <application', 1)
          p.write_text(text)

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Nera-AI-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Nera-AI-APK
          path: Nera-AI-debug.apk
          if-no-files-found: error
          retention-days: 14
