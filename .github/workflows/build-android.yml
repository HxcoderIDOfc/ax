name: Build Nera AI APK

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-24.04
    env:
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
      VITE_NERA_MODEL: Nera-V4
      NERA_KEYSTORE_BASE64: ${{ secrets.NERA_KEYSTORE_BASE64 }}
      NERA_KEYSTORE_PASSWORD: ${{ secrets.NERA_KEYSTORE_PASSWORD }}
      NERA_KEY_ALIAS: ${{ secrets.NERA_KEY_ALIAS }}
      NERA_KEY_PASSWORD: ${{ secrets.NERA_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Select Java 21
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Verify secrets
        shell: bash
        run: |
          test -n "$VITE_GOOGLE_WEB_CLIENT_ID"
          test -n "$NERA_KEYSTORE_BASE64"
          test -n "$NERA_KEYSTORE_PASSWORD"
          test -n "$NERA_KEY_ALIAS"
          test -n "$NERA_KEY_PASSWORD"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch Axynera SDK v0.4.2
        shell: bash
        run: |
          mkdir -p src/vendor
          curl -fSL --retry 3 --retry-all-errors \
            "https://sdk.axynera.my.id/v/0.4.2/axynera.mjs" \
            -o src/vendor/axynera.mjs
          test -s src/vendor/axynera.mjs
          node --check src/vendor/axynera.mjs
          echo "Axynera SDK v0.4.2 bundled locally: $(wc -c < src/vendor/axynera.mjs) bytes"

      - name: Fix Google login options for Android
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/App.jsx")
          s = p.read_text()
          s = s.replace("options:{scopes:['email','profile'],filterByAuthorizedAccounts:false}", "options:{filterByAuthorizedAccounts:false}")
          s = s.replace("options: { scopes: ['email', 'profile'], filterByAuthorizedAccounts: false }", "options: { filterByAuthorizedAccounts: false }")
          p.write_text(s)

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Restore release keystore
        shell: bash
        run: |
          mkdir -p android/keystore
          printf '%s' "$NERA_KEYSTORE_BASE64" | base64 --decode > android/keystore/nera-release.jks
          keytool -list -keystore android/keystore/nera-release.jks -storepass "$NERA_KEYSTORE_PASSWORD" -alias "$NERA_KEY_ALIAS" >/dev/null

      - name: Configure Android release
        shell: python
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          from pathlib import Path
          import os, re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if "android.permission.RECORD_AUDIO" not in text:
              additions = """    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />
          """
              text = text.replace("<application", additions + "\n    <application", 1)
              manifest.write_text(text)

          gradle = Path("android/app/build.gradle")
          g = gradle.read_text()
          code = os.environ["VERSION_CODE"]
          g = re.sub(r"versionCode\s+\d+", f"versionCode {code}", g)
          g = re.sub(r"versionName\s+\"[^\"]+\"", f"versionName \"0.1.{code}\"", g)

          signing = """    signingConfigs {
              neraRelease {
                  storeFile file(\"../keystore/nera-release.jks\")
                  storePassword System.getenv(\"NERA_KEYSTORE_PASSWORD\")
                  keyAlias System.getenv(\"NERA_KEY_ALIAS\")
                  keyPassword System.getenv(\"NERA_KEY_PASSWORD\")
              }
          }
          """
          if "neraRelease" not in g:
              g = g.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
          g = g.replace("release {\n", "release {\n            signingConfig signingConfigs.neraRelease\n", 1)
          gradle.write_text(g)

      - name: Show release SHA
        shell: bash
        run: |
          keytool -list -v -keystore android/keystore/nera-release.jks -storepass "$NERA_KEYSTORE_PASSWORD" -alias "$NERA_KEY_ALIAS" | grep -E 'SHA1:|SHA256:'

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk "Nera-AI-v0.1.${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Nera-AI-v0.1.${{ github.run_number }}
          path: Nera-AI-v0.1.${{ github.run_number }}.apk
          retention-days: 14
